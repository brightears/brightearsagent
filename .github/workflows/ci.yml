# CI safety checks. Render must also be configured to wait for this check before
# it becomes a release gate; that dashboard setting is tracked separately.
name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma validates that this exists during `npm ci`/postinstall. CI does
      # not query a database: unit tests mock persistence and the build only
      # compiles application code.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/brightears_ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
