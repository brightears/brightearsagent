# CI safety checks. Render must also be configured to wait for this check before
# it becomes a release gate; that dashboard setting is tracked separately.
name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: brightears_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d brightears_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The same URL powers Prisma generation and an empty-database migration
      # smoke test. Unit tests continue to mock persistence.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/brightears_ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npx prisma migrate status
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build-time canonical only. Keeping this out of the job-level env
          # prevents unit tests from intentionally entering public-origin
          # fail-closed mode without production secrets.
          APP_URL: https://brightears.io
